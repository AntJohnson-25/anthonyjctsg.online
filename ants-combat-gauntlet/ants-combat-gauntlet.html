<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
/* iPhone Safari ignores user-scalable=no (Apple turned it off for accessibility), so a quick
   double tap on a button zooms the page and pinching back out is fiddly mid-game. Block it here:
   - the second tap of a double tap has its touchend cancelled (that is what triggers the zoom);
   - Safari's pinch gestures, and any two-finger move, are cancelled.
   The game reads input from pointer events, which fire before touchend, so no press is lost. */
(function () {
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault();
  }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0710">
<title>Ant's Combat Gauntlet</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0710; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center; height: 100dvh;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none;
  }
  #game {
    display: block; background: #120b18;
    width: min(100vw, calc(100dvh * 16 / 9)); height: min(100dvh, calc(100vw * 9 / 16));
    image-rendering: auto; touch-action: none;
  }

  /* Touch pad. --u is one "unit" of button size, scaled to the short side of the screen. */
  #touch { --u: min(1vmin, 4.6px); position: fixed; inset: 0; pointer-events: none; }
  #touch[hidden], #touch:not(.show) > * { display: none; }
  #touch button, #dpad {
    position: absolute; pointer-events: auto; touch-action: none; padding: 0;
    border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
    background: rgba(20,6,10,0.38); color: #fff;
    font: 800 calc(var(--u) * 3.4) Impact, 'Arial Black', system-ui, sans-serif; letter-spacing: 0.5px;
    text-shadow: 0 1px 2px #000;
  }
  #touch button.on { background: rgba(255,90,60,0.65); border-color: #ffcf5a; }
  #touch button.big { border-width: 3px; background: rgba(150,20,20,0.42); font-size: calc(var(--u) * 4.2); }
  #touch button.cd { opacity: 0.45; }
  .pos { width: calc(var(--u) * var(--s)); height: calc(var(--u) * var(--s)); right: calc(var(--u) * var(--r) + env(safe-area-inset-right)); bottom: calc(var(--u) * var(--b) + env(safe-area-inset-bottom)); }

  #dpad {
    left: calc(var(--u) * 4 + env(safe-area-inset-left)); bottom: calc(var(--u) * 4 + env(safe-area-inset-bottom));
    width: calc(var(--u) * 38); height: calc(var(--u) * 38);
  }
  #dpad .arrow { position: absolute; color: rgba(255,255,255,0.7); font-size: calc(var(--u) * 5); line-height: 1; transform: translate(-50%, -50%); }
  #dpad .arrow.on { color: #ffcf5a; }
  #dpad .knob {
    position: absolute; left: 50%; top: 50%; width: 28%; height: 28%; border-radius: 50%;
    background: rgba(255,255,255,0.28); border: 2px solid rgba(255,255,255,0.6);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #dpad .lbl { position: absolute; font-size: calc(var(--u) * 2.4); color: rgba(255,255,255,0.75); transform: translate(-50%, -50%); }
  #pause { width: calc(var(--u) * 11); height: calc(var(--u) * 11); left: calc(var(--u) * 2 + env(safe-area-inset-left)); top: calc(var(--u) * 2 + env(safe-area-inset-top)); font-size: calc(var(--u) * 4); }

  /* Portrait: the game sits at the top and the pad gets the empty space below it. */
  body.portrait { align-items: flex-start; }
  body.portrait #touch { --u: min(0.88vw, 4.6px); top: calc(100vw * 9 / 16); }
  body.portrait #pause { left: auto; right: calc(var(--u) * 3); top: calc(var(--u) * 3); }
  body.portrait #rotate { display: block; }
  #rotate { display: none; position: fixed; left: 0; right: 0; top: calc(100vw * 9 / 16 + 10px); text-align: center; color: rgba(255,255,255,0.55); font: 600 13px system-ui, sans-serif; pointer-events: none; }
  #touch.show ~ #rotate { display: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>

<div id="touch" hidden>
  <div id="dpad">
    <span class="arrow" data-dir="up" style="left:50%;top:15%">▲</span>
    <span class="arrow" data-dir="left" style="left:15%;top:50%">◀</span>
    <span class="arrow" data-dir="right" style="left:85%;top:50%">▶</span>
    <span class="arrow" data-dir="down" style="left:50%;top:85%">▼</span>
    <span class="lbl" style="left:50%;top:27%">JUMP</span>
    <span class="lbl" style="left:50%;top:73%">BLOCK</span>
    <div class="knob"></div>
  </div>
  <button class="pos big" data-key="KeyJ" style="--s:21;--r:25;--b:3">PUNCH</button>
  <button class="pos big" data-key="KeyK" style="--s:21;--r:3;--b:15">KICK</button>
  <button class="pos big" data-key="KeyU" style="--s:17;--r:29;--b:27">UPPER</button>
  <button class="pos big" data-key="KeyI" style="--s:17;--r:7;--b:39">ROUND</button>
  <button class="pos" data-key="Space" style="--s:14;--r:50;--b:3">ROLL</button>
  <button class="pos" data-key="flip" style="--s:14;--r:51;--b:20">FLIP</button>
  <button class="pos" data-key="KeyL" data-move="shoot" data-label="GUN" style="--s:14;--r:48;--b:37">GUN</button>
  <button class="pos" data-key="KeyO" data-move="special" data-label="SPEC" style="--s:14;--r:28;--b:47">SPEC</button>
  <button id="pause" data-key="Escape">II</button>
</div>
<div id="rotate">turn your phone sideways for a bigger view</div>

<script src="assets/sprites/manifest.js"></script>
<script src="src/data.js"></script>
<script src="src/game.js"></script>
</body>
</html>
