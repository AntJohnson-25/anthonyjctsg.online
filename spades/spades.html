<script>
/* iPhone Safari ignores user-scalable=no: cancel double-tap zoom and pinch (as on the arcade's other games). */
(function () {
  var last = 0;
  document.addEventListener("touchend", function (e) { var now = Date.now(); if (now - last < 350) e.preventDefault(); last = now; }, { passive: false });
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>

<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("err");
    el.hidden = false;
    el.textContent = "Error: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")";
  });
</script>
<script>
/* The game's scripts, in order. They download in parallel and each one is retried if
   the network drops it; then they run in this order. The characters (chars/*.js) load
   after these, from src/body.js. */
(function () {
  var FILES = ["vendor/three.min.js", "src/util.js?v=1", "src/strings.js?v=2", "src/rules.js?v=1", "src/bot.js?v=1",
    "src/table.js?v=1", "src/net.js?v=1", "src/build.js?v=1", "src/cast.js?v=1", "src/clips.js?v=1", "src/body.js?v=1",
    "src/ocean.js?v=1", "src/villa.js?v=1", "src/view.js?v=1", "src/cards.js?v=3", "src/seats.js?v=1", "src/crowd.js?v=1", "src/portraits.js?v=1",
    "src/audio.js?v=1", "src/hud.js?v=2", "src/tutorial.js?v=1", "src/main.js?v=3"];
  function fail(src) {
    var el = document.getElementById("err");
    el.hidden = false;
    el.textContent = "Couldn't download " + src.split("?")[0] + ". Check your connection and reload.";
  }
  if (location.protocol === "file:") {
    FILES.forEach(function (src) { document.write('<script src="' + src + '"><\/script>'); });
    return;
  }
  function get(src, attempt) {
    var url = attempt ? src + (src.indexOf("?") < 0 ? "?" : "&") + "retry=" + attempt : src;
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).catch(function () {
      if (attempt >= 4) { fail(src); throw new Error("gave up on " + src); }
      return new Promise(function (ok) { setTimeout(ok, 400 * (attempt + 1)); }).then(function () { return get(src, attempt + 1); });
    });
  }
  Promise.all(FILES.map(function (src) { return get(src, 0); })).then(function (texts) {
    texts.forEach(function (text, i) {
      var s = document.createElement("script");
      s.textContent = text + "\n//# sourceURL=" + new URL(FILES[i], location.href).href;
      document.body.appendChild(s);
    });
  }, function () { /* fail() already said which file */ });
})();
</script>
