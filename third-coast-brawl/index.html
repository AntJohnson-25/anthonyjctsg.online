<script>
/* iPhone Safari ignores user-scalable=no: cancel pinch gestures, two-finger moves and a double
   tap's second touchend so the page can't zoom. Same guard as the other games on the site. */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault();
  }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) { var n = Date.now(); if (n - last < 350) e.preventDefault(); last = n; }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  // headless checks read script errors from the title
  window.addEventListener("error", function (e) { document.title = "ERR " + e.message + " @" + String(e.filename || "").split("/").pop() + ":" + e.lineno; });
})();
</script>
